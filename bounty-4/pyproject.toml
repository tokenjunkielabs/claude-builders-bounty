[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-review-agent"
version = "1.0.0"
description = "Claude Code CLI agent for structured GitHub pull-request reviews"
requires-python = ">=3.10"

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
